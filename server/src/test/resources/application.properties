# Test-suite defaults: unit/slice tests do not need a live database, so the
# datasource and JPA (Hibernate + Spring Data repositories) are excluded here.
# Live connectivity and schema creation are covered by NeonConnectivityTest and
# NeonChatMemorySchemaTest, which read DB_* straight from the environment and
# skip themselves when they are absent.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
