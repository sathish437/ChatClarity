spring.config.import=optional:file:.env[.properties]
spring.application.name=chat
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
# Show our static error reason (e.g. quota message) in error responses; stack traces stay hidden.

# Neon PostgreSQL datasource. Credentials come from the environment only;
# never commit real values. DB_URL must be a JDBC URL, e.g.
# jdbc:postgresql://<host>:5432/neondb?sslmode=require&channelBinding=require
# Leave JDBC chat-memory initialization disabled unless a Neon database is configured.
spring.ai.chat.memory.repository.jdbc.initialize-schema=${SPRING_AI_CHAT_MEMORY_JDBC_INITIALIZE_SCHEMA:never}
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD}

# Application-owned JPA history. Hibernate update only adds missing tables/columns; it
# never drops or truncates, so Spring AI's SPRING_AI_CHAT_MEMORY table is left untouched.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
